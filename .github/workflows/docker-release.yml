name: Build and Publish Docker Image

# Fires only when a GitHub Release is explicitly published.
# Draft and unpublished releases do NOT trigger this workflow.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push multi-platform image
    runs-on: ubuntu-latest

    steps:
      # ── 1. Lowercase image name ────────────────────────────────────────────
      # github.repository preserves the owner's original casing (e.g.
      # "JakeWard98/qbitread"). Docker registry refs must be fully lowercase,
      # so we convert once here and use IMAGE_NAME for all subsequent steps.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      # ── 2. QEMU for cross-platform emulation ───────────────────────────────
      # Allows the amd64 runner to build ARM64 images via software emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      # ── 3. Docker Buildx ───────────────────────────────────────────────────
      # Required for multi-platform builds and registry-based layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # ── 4. Log in to GHCR ─────────────────────────────────────────────────
      # Uses the auto-injected GITHUB_TOKEN — no manual secrets required.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Extract Docker metadata ─────────────────────────────────────────
      # Given a stable release tag of v1.2.3, this generates:
      #   ghcr.io/jakeward98/qbitread:1.2.3
      #   ghcr.io/jakeward98/qbitread:1.2
      #   ghcr.io/jakeward98/qbitread:1
      #   ghcr.io/jakeward98/qbitread:latest
      # Given a pre-release tag of v1.2.3-beta.1, this generates:
      #   ghcr.io/jakeward98/qbitread:1.2.3-beta.1
      #   ghcr.io/jakeward98/qbitread:beta
      #   (latest is NOT updated for pre-releases)
      # OCI-standard labels (org.opencontainers.image.*) are also attached.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=beta,enable=${{ github.event.release.prerelease }}

      # ── 6. Build and push ──────────────────────────────────────────────────
      # Registry cache (type=registry, mode=max) is used instead of type=gha
      # because concurrent multi-platform builds write cache layers in parallel;
      # the GHA cache backend cannot handle concurrent writes from multiple
      # platforms. The registry backend stores cache manifests in GHCR alongside
      # the image and handles this correctly.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # ── 7. Print image digest ──────────────────────────────────────────────
      # The sha256 digest is the immutable identifier for this exact build.
      # Useful for pinning in production deployments and for audit trails.
      - name: Print image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image digest $DIGEST"
